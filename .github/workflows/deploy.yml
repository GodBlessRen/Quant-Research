name: Publish Quant Research

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quant-research-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Check and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Verify complete textbook and reader scripts
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site.js
          test -s site.css
          test -f book/manifest.json
          test "$(find book/cn -type f -name '*.md' | wc -l)" -eq 71
          test "$(find book/cn -type f -name '*.svg' | wc -l)" -eq 69
          node --check site.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path('book/manifest.json').read_text(encoding='utf8'))
          assert manifest['count'] == 71
          for page in manifest['pages']:
              assert Path(page['path']).is_file(), page['path']
          html=Path('index.html').read_text(encoding='utf8')
          assert '<html lang="zh-CN">' in html
          assert 'site.js' in html and 'site.css' in html
          print('Validated: 71 full chapters, 69 SVG diagrams, complete reader.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Deploy website
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
