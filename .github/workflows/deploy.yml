name: Publish Quant Research

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quant-research-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Check and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate homepage and JavaScript
        shell: bash
        run: |
          test -s index.html
          test -f .nojekyll
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.scripts.append(data)
          parser = Scripts()
          homepage = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="zh-CN">' in homepage
          parser.feed(homepage)
          assert parser.scripts, "Expected inline JavaScript"
          Path("/tmp/quant-research-main.js").write_text("\n".join(parser.scripts), encoding="utf-8")
          print("Homepage and JavaScript extracted")
          PY
          node --check /tmp/quant-research-main.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Deploy website
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
